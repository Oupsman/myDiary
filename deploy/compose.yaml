# Copied to the server by the Woodpecker pipeline; MYDIARY_TAG comes from .env.
services:
  mydiary-server:
    image: ghcr.io/oupsman/mydiary-server:${MYDIARY_TAG:-latest}
    restart: unless-stopped
    # Localhost only: the TLS reverse proxy sits in front, as in the README.
    ports:
      - "127.0.0.1:8484:8484"
    volumes:
      - mydiary-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mydiary-data:
